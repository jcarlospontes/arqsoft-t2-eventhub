# Front + mini API Gateway: um único endereço (http://localhost:3000) para o navegador.
# Cada prefixo /api/<servico>/ e encaminhado ao servico correspondente na rede do Compose.
# O resolver do Docker com variaveis faz o nginx reencontrar um servico que foi parado e religado.
server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_read_timeout 30s;
    proxy_connect_timeout 2s;

    location / {
        try_files $uri /index.html;
    }

    location /api/catalog/ {
        set $up http://catalog:8000;
        rewrite ^/api/catalog/(.*)$ /$1 break;
        proxy_pass $up;
    }

    location /api/registration/ {
        set $up http://registration:8080;
        rewrite ^/api/registration/(.*)$ /$1 break;
        proxy_pass $up;
    }

    location /api/payment/ {
        set $up http://payment:8000;
        rewrite ^/api/payment/(.*)$ /$1 break;
        proxy_pass $up;
    }

    location /api/notification/ {
        set $up http://notification:8000;
        rewrite ^/api/notification/(.*)$ /$1 break;
        proxy_pass $up;
    }

    location = /docs/openapi-registration.yaml {
        alias /usr/share/nginx/html/openapi-registration.yaml;
        default_type text/plain;
    }
}
